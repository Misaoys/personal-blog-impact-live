<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-MNuDzYfPlvcYo4K1SHZ0dY48kZcDOS52gMSe7QA9yFU='; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="permissions-policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=()">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>ExprFlow 核单</title>
    <style>
      * { box-sizing: border-box; }
      :root {
        color-scheme: light;
        background: #f6f7f2;
        color: #151515;
        font-family: Arial, "Microsoft YaHei", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f6f7f2;
      }
      main {
        width: min(1120px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 28px 0 40px;
      }
      h1 {
        margin: 0;
        font-size: clamp(26px, 3vw, 42px);
        line-height: 1.15;
      }
      .topbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(280px, 420px);
        gap: 18px;
        align-items: end;
        margin-bottom: 22px;
      }
      .auth {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        padding: 12px;
        border: 1px solid #d8dacd;
        background: #ffffff;
      }
      label {
        display: grid;
        gap: 6px;
        color: #55594c;
        font-size: 12px;
        font-weight: 700;
      }
      input {
        width: 100%;
        min-height: 42px;
        border: 1px solid #c9cbbb;
        background: #fbfcf7;
        color: #151515;
        padding: 0 12px;
        font: inherit;
      }
      button {
        min-height: 42px;
        border: 1px solid #151515;
        background: #151515;
        color: #ffffff;
        padding: 0 14px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        border-color: #c7c8bd;
        background: #e5e6dd;
        color: #8c8f82;
        cursor: not-allowed;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 16px;
      }
      .metric {
        border: 1px solid #d8dacd;
        background: #ffffff;
        padding: 14px;
        min-height: 76px;
      }
      .metric strong {
        display: block;
        margin-top: 8px;
        font-size: 24px;
      }
      .status {
        min-height: 24px;
        margin: 0 0 14px;
        color: #55594c;
      }
      .orders {
        display: grid;
        gap: 12px;
      }
      .order {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(300px, .9fr);
        gap: 16px;
        border: 1px solid #d8dacd;
        background: #ffffff;
        padding: 16px;
      }
      .order h2 {
        margin: 0 0 12px;
        font-size: 18px;
        overflow-wrap: anywhere;
      }
      .fields {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .field {
        min-height: 54px;
        border-top: 1px solid #eceee4;
        padding-top: 8px;
        overflow-wrap: anywhere;
      }
      .field span,
      .metric span {
        display: block;
        color: #6f7464;
        font-size: 12px;
        font-weight: 700;
      }
      .field code {
        color: #151515;
        font-family: Consolas, "Liberation Mono", monospace;
        font-size: 13px;
      }
      .checks {
        display: grid;
        gap: 10px;
        align-content: start;
      }
      .check {
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr);
        gap: 10px;
        align-items: start;
        min-height: 34px;
        color: #222;
        font-size: 14px;
      }
      .check input {
        width: 18px;
        min-height: 18px;
        margin: 1px 0 0;
      }
      .actions {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        margin-top: 4px;
      }
      .result {
        min-height: 22px;
        color: #3f6f45;
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      .empty {
        border: 1px solid #d8dacd;
        background: #ffffff;
        padding: 22px;
      }
      @media (max-width: 820px) {
        main { width: min(100vw - 24px, 640px); padding-top: 18px; }
        .topbar,
        .auth,
        .summary,
        .order,
        .fields,
        .actions {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main data-expr-admin-panel>
      <section class="topbar">
        <h1>ExprFlow 核单</h1>
        <form class="auth" data-auth-form>
          <label>
            管理 Token
            <input data-token type="password" autocomplete="off" spellcheck="false">
          </label>
          <button type="submit">刷新</button>
        </form>
      </section>

      <section class="summary" aria-label="订单摘要">
        <div class="metric"><span>待核对</span><strong data-summary="manual_review">0</strong></div>
        <div class="metric"><span>缺卡密</span><strong data-summary="missingLicense">0</strong></div>
        <div class="metric"><span>已发卡</span><strong data-summary="paid">0</strong></div>
        <div class="metric"><span>全部</span><strong data-summary="total">0</strong></div>
      </section>

      <p class="status" data-status role="status" aria-live="polite"></p>
      <section class="orders" data-orders></section>
    </main>

    <template data-order-template>
      <article class="order">
        <section>
          <h2><code data-order-id></code></h2>
          <div class="fields">
            <div class="field"><span>买家邮箱</span><code data-email></code></div>
            <div class="field"><span>金额</span><code data-amount></code></div>
            <div class="field"><span>订单备注</span><code data-note></code></div>
            <div class="field"><span>状态</span><code data-order-status></code></div>
          </div>
        </section>
        <section class="checks">
          <label class="check"><input type="checkbox" data-check="amount">支付宝到账金额是 30.00 RMB</label>
          <label class="check"><input type="checkbox" data-check="note">支付宝备注等于订单备注</label>
          <label class="check"><input type="checkbox" data-check="email">买家邮箱与订单一致</label>
          <div class="actions">
            <span class="result" data-result></span>
            <button type="button" data-fulfill disabled>确认并发卡</button>
          </div>
        </section>
      </article>
    </template>

    <script>
      (() => {
        const tokenInput = document.querySelector("[data-token]");
        const authForm = document.querySelector("[data-auth-form]");
        const statusEl = document.querySelector("[data-status]");
        const ordersEl = document.querySelector("[data-orders]");
        const template = document.querySelector("[data-order-template]");
        const summaryEls = new Map(
          [...document.querySelectorAll("[data-summary]")].map(node => [node.dataset.summary, node])
        );

        tokenInput.value = sessionStorage.getItem("exprFlowAdminToken") || "";

        function token() {
          return tokenInput.value.trim();
        }

        function setStatus(message) {
          statusEl.textContent = message;
        }

        function authHeaders() {
          return {
            Authorization: `Bearer ${token()}`,
            "Content-Type": "application/json"
          };
        }

        function text(value) {
          return String(value || "");
        }

        function updateSummary(summary = {}) {
          for (const [key, node] of summaryEls) node.textContent = String(summary[key] || 0);
        }

        function checksFor(card) {
          return Object.fromEntries(
            [...card.querySelectorAll("[data-check]")].map(input => [input.dataset.check, input.checked])
          );
        }

        function syncButton(card) {
          const checks = checksFor(card);
          card.querySelector("[data-fulfill]").disabled = !(checks.amount && checks.note && checks.email);
        }

        function renderOrders(orders = []) {
          ordersEl.textContent = "";
          if (!orders.length) {
            const empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = "没有待核对订单";
            ordersEl.append(empty);
            return;
          }
          for (const order of orders) {
            const card = template.content.firstElementChild.cloneNode(true);
            card.querySelector("[data-order-id]").textContent = text(order.orderId);
            card.querySelector("[data-email]").textContent = text(order.email);
            card.querySelector("[data-amount]").textContent = `${text(order.amount)} RMB`;
            card.querySelector("[data-note]").textContent = text(order.manualNote || order.orderId);
            card.querySelector("[data-order-status]").textContent = text(order.status);
            card.querySelectorAll("[data-check]").forEach(input => {
              input.addEventListener("change", () => syncButton(card));
            });
            card.querySelector("[data-fulfill]").addEventListener("click", () => fulfillOrder(card, order));
            ordersEl.append(card);
          }
        }

        async function loadOrders() {
          if (!token()) {
            setStatus("需要管理 Token");
            return;
          }
          sessionStorage.setItem("exprFlowAdminToken", token());
          setStatus("读取中");
          const response = await fetch("/api/expr-flow/admin/orders?status=actionable", {
            headers: authHeaders()
          });
          if (!response.ok) {
            setStatus(response.status === 401 ? "Token 无效" : "读取失败");
            return;
          }
          const payload = await response.json();
          updateSummary(payload.summary);
          renderOrders(payload.orders);
          setStatus("已刷新");
        }

        async function fulfillOrder(card, order) {
          const resultEl = card.querySelector("[data-result]");
          const button = card.querySelector("[data-fulfill]");
          button.disabled = true;
          resultEl.textContent = "发卡中";
          const response = await fetch(`/api/expr-flow/admin/orders/${encodeURIComponent(order.orderId)}/fulfill`, {
            method: "POST",
            headers: authHeaders(),
            body: JSON.stringify({
              reviewedBy: "local-panel",
              confirmations: checksFor(card)
            })
          });
          if (!response.ok) {
            resultEl.textContent = "未发卡，请重新核对";
            syncButton(card);
            return;
          }
          const payload = await response.json();
          resultEl.textContent = payload.mailResult?.status === "sent" ? "已发卡并发送邮件" : "已发卡";
          await loadOrders();
        }

        authForm.addEventListener("submit", event => {
          event.preventDefault();
          loadOrders();
        });
        if (token()) loadOrders();
        else setStatus("需要管理 Token");
      })();
    </script>
  </body>
</html>
